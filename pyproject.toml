[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "uncp_offsec"
version = "0.3.1"
description = "Automated email + web asset assessment: wraps MailSec and a pipeline of battle-tested recon tools"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "UnCP OffSec" }]
keywords = ["security", "recon", "email", "spf", "dkim", "dmarc", "web", "nuclei", "subfinder"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Environment :: Console",
]

dependencies = [
    "click>=8.1",
    "dnspython>=2.4",
    "cryptography>=41.0",
    "rich>=13.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
uncp_offsec = "uncp_offsec.cli:cli"
mailsec = "mailsec.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mailsec = ["reports/templates/*.html"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
# Network tools intentionally degrade gracefully on socket/DNS errors.
"src/mailsec/modules/*.py" = ["BLE001", "S110", "S108"]
"src/uncp_offsec/web/*.py" = ["BLE001", "S110", "S108", "S603"]
# Test inline DNS mock classes share attrs between instances.
"tests/*.py" = ["RUF012", "RUF015", "RUF059", "S110", "BLE001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
